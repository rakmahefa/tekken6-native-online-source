name: Linux AppImage prerelease

on:
  push:
    branches:
      - feature/native-linux-build
      - feature/appimage-workspace-override
    tags:
      - 'v*-test.*'
  pull_request:
    branches:
      - main
      - feature/native-linux-build
  workflow_dispatch:
    inputs:
      version:
        description: "Test prerelease version (for example 0.1.0-test.1)"
        required: true
        default: "0.1.0-test.1"
        type: string
      publish_prerelease:
        description: "Publish the successfully built AppImage as a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Build Linux AppImage and CI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout source and pinned ReXGlue submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install Linux launcher build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build qt6-base-dev qt6-qpa-plugins qt6-wayland \
            libqt6svg6 libssl-dev libxkbcommon-dev curl file squashfs-tools desktop-file-utils

      - name: Compute test-channel version
        id: meta
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish_prerelease }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
            TAG="v$VERSION"
            PUBLISH="$DISPATCH_PUBLISH"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]] && \
              git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq "packaging/appimage/PRERELEASE_VERSION"; then
            VERSION="$(tr -d '\r\n' < packaging/appimage/PRERELEASE_VERSION)"
            TAG="v$VERSION"
            PUBLISH=true
          else
            VERSION="0.0.0-test.${GITHUB_RUN_NUMBER}"
            TAG=""
            PUBLISH=false
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "Expected a prerelease version such as 0.1.0-test.1; got '$VERSION'." >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building test-channel AppImage version $VERSION (publish=$PUBLISH)."

      - name: Download linuxdeploy, Qt plugin and appimagetool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/appimage-tools
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output build/appimage-tools/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output build/appimage-tools/linuxdeploy-plugin-qt-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output build/appimage-tools/appimagetool-x86_64.AppImage
          chmod +x build/appimage-tools/*.AppImage
          bash -n tools/build_appimage.sh packaging/appimage/AppRun

      - name: Assemble AppImage
        env:
          T6_APPIMAGE_VERSION: ${{ steps.meta.outputs.version }}
          T6_APPIMAGE_SOURCE_VERSION: ${{ steps.meta.outputs.version }}-${{ github.sha }}
          T6_APPIMAGE_BUILD_DIR: ${{ github.workspace }}/build/appimage
          T6_APPIMAGE_OUT_DIR: ${{ github.workspace }}/dist
          LINUXDEPLOY_BIN: ${{ github.workspace }}/build/appimage-tools/linuxdeploy-x86_64.AppImage
          APPIMAGETOOL_BIN: ${{ github.workspace }}/build/appimage-tools/appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash tools/build_appimage.sh

      - name: Verify AppImage and checksum
        shell: bash
        env:
          T6_APPIMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          test -s dist/Tekken6NativeOnline-x86_64.AppImage
          test -x dist/Tekken6NativeOnline-x86_64.AppImage
          file dist/Tekken6NativeOnline-x86_64.AppImage
          grep -q 'ELF' <(file dist/Tekken6NativeOnline-x86_64.AppImage)
          (cd dist && sha256sum --check SHA256SUMS)
          desktop-file-validate build/appimage/AppDir/usr/share/applications/tekken6-native-online.desktop
          # Assert that the public release feed and this exact prerelease version were compiled in.
          grep -Fq 'api.github.com/repos/rakmahefa/tekken6-native-online-source/releases/latest' build/appimage/launcher/build.ninja
          grep -Fq 'T6_VERSION' build/appimage/launcher/build.ninja
          grep -Fq "$T6_APPIMAGE_VERSION" build/appimage/launcher/build.ninja
          # Wayland QPA loads these from plugin categories separate from platforms/.
          test -s build/appimage/AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -s build/appimage/AppDir/usr/plugins/wayland-shell-integration/libwl-shell-plugin.so
          test -s build/appimage/AppDir/usr/plugins/wayland-shell-integration/libivi-shell.so
          test -s build/appimage/AppDir/usr/plugins/wayland-shell-integration/libqt-shell.so
          test -s build/appimage/AppDir/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so

      - name: Smoke-test AppImage startup, SVG icons, Wayland integrations and Qt TLS backend
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/appimage-startup.log"
          set +e
          timeout --signal=TERM 12s env \
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/Tekken6NativeOnline-x86_64.AppImage >"$log" 2>&1
          status=$?
          set -e
          # The GUI event loop is expected to remain open until timeout.
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat "$log"
            echo "AppImage startup smoke test exited with status $status" >&2
            exit "$status"
          fi
          if grep -E \
            'Could not find the Qt platform plugin|No shell integration named|Loading shell integration failed|Failed to load client buffer integration|Available client buffer integrations: QList\(\)|Failed to load libssl/libcrypto|does not support QSslSocket|QPainter::begin: Paint device returned engine == 0' \
            "$log"; then
            cat "$log"
            echo "AppImage is missing a required Qt image/platform/TLS component." >&2
            exit 1
          fi
          # GitHub may return 403/429 for shared hosted-runner IPs. Any HTTP
          # status means HTTPS/TLS negotiation and certificate verification
          # completed; explicit Qt/OpenSSL transport errors are rejected above.
          if ! grep -Eq 'GitHub release feed reachable \(HTTP 200\)|GitHub release check failed \(HTTP status [0-9]{3}' "$log"; then
            cat "$log"
            echo "The bundled Qt networking/TLS runtime did not receive an HTTP response from the configured GitHub release feed." >&2
            exit 1
          fi
          cat "$log"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6NativeOnline-linux-${{ steps.meta.outputs.version }}
          path: |
            dist/Tekken6NativeOnline-x86_64.AppImage
            dist/SHA256SUMS
            dist/README-linux-appimage.txt
          if-no-files-found: error
          retention-days: 14

  smoke-test-builder-workspace:
    name: Extract workspace, patch SDK, and configure/build with CMake
    needs: build-appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source-side regression tests
        uses: actions/checkout@v4

      - name: Download the exact AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: Tekken6NativeOnline-linux-${{ needs.build-appimage.outputs.version }}
          path: dist

      - name: Install native builder and CMake dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build python3 git build-essential \
            libc++-18-dev libc++abi-18-dev \
            libvulkan-dev libgtk-3-dev libx11-xcb-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Extract AppImage and stage a custom writable workspace
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$GITHUB_WORKSPACE/dist/Tekken6NativeOnline-x86_64.AppImage"
          (cd dist && sha256sum --check SHA256SUMS)
          chmod +x "$APPIMAGE"

          EXTRACT_ROOT="$RUNNER_TEMP/t6-appimage-extracted"
          mkdir -p "$EXTRACT_ROOT"
          (cd "$EXTRACT_ROOT" && "$APPIMAGE" --appimage-extract)
          APPDIR="$EXTRACT_ROOT/squashfs-root"
          BUNDLE="$APPDIR/usr/share/tekken6-native-online/workspace.tar.gz"
          test -s "$BUNDLE"
          test -s "$APPDIR/usr/share/tekken6-native-online/source-version"

          # Use a pre-existing workspace with sentinel state to verify that
          # AppRun chooses the requested root without deleting native/ data.
          CUSTOM_WORKSPACE="$RUNNER_TEMP/t6-custom-workspace"
          mkdir -p "$CUSTOM_WORKSPACE/native"
          printf 'keep-local-native-data\n' > "$CUSTOM_WORKSPACE/native/.ci-preserve-me"
          cat > "$APPDIR/usr/bin/tekken6-native-online" <<'STUB'
          #!/bin/sh
          set -eu
          printf '%s\n' "${T6_PORT_ROOT:?AppRun did not export T6_PORT_ROOT}" > "${RUNNER_TEMP:?}/selected-workspace.txt"
          STUB
          chmod +x "$APPDIR/usr/bin/tekken6-native-online"

          T6_WORKSPACE_DIR="$CUSTOM_WORKSPACE" "$APPDIR/AppRun"
          test "$(cat "$RUNNER_TEMP/selected-workspace.txt")" = "$CUSTOM_WORKSPACE"
          test -s "$CUSTOM_WORKSPACE/builder/build_native_linux.py"
          test -f "$CUSTOM_WORKSPACE/native/.ci-preserve-me"
          test "$(cat "$CUSTOM_WORKSPACE/native/.ci-preserve-me")" = "keep-local-native-data"

          # AppImage source archives must not depend on Git worktree metadata.
          if find "$CUSTOM_WORKSPACE" -name .git -print -quit | grep -q .; then
            echo "Unexpected .git metadata in the AppImage workspace." >&2
            exit 1
          fi

      - name: Syntax-check packaged Python and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_WORKSPACE="$RUNNER_TEMP/t6-custom-workspace"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/t6-pycache"
          python3 -m compileall -q "$CUSTOM_WORKSPACE/builder" "$CUSTOM_WORKSPACE/tools"
          sh -n "$CUSTOM_WORKSPACE/packaging/appimage/AppRun"
          bash -n "$CUSTOM_WORKSPACE/tools/build_appimage.sh"
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find "$CUSTOM_WORKSPACE/builder" "$CUSTOM_WORKSPACE/tools" -type f -name '*.sh' -print0)

      - name: Apply SDK patches in source-archive mode
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_WORKSPACE="$RUNNER_TEMP/t6-custom-workspace"
          SDK="$CUSTOM_WORKSPACE/third_party/rexglue-sdk"
          test -s "$SDK/CMakeLists.txt"
          test -s "$SDK/thirdparty/CMakeLists.txt"
          python3 "$CUSTOM_WORKSPACE/tools/apply_rexglue_patches.py" --sdk "$SDK"
          grep -Fq 'if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/../.git" AND NOT EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/${submodule}/.git")' "$SDK/thirdparty/CMakeLists.txt"
          # Running the patcher twice must remain safe and deterministic.
          python3 "$CUSTOM_WORKSPACE/tools/apply_rexglue_patches.py" --sdk "$SDK"

      - name: Run packaged builder regression tests
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_WORKSPACE="$RUNNER_TEMP/t6-custom-workspace"
          mkdir -p "$CUSTOM_WORKSPACE/tests"
          install -m 0644 tests/test_linux_builder_incremental.py "$CUSTOM_WORKSPACE/tests/"
          cd "$CUSTOM_WORKSPACE"
          python3 tests/test_linux_builder_incremental.py
          python3 builder/build_native_linux.py --help | tee "$RUNNER_TEMP/builder-help.txt"
          grep -Fq 'builder/build_native_linux.py --update' "$RUNNER_TEMP/builder-help.txt"

          # With no private game image in CI, --update must stop at validation
          # and must not start CMake or delete pre-existing native/ data.
          set +e
          python3 builder/build_native_linux.py --update > "$RUNNER_TEMP/builder-update.txt" 2>&1
          update_status=$?
          set -e
          cat "$RUNNER_TEMP/builder-update.txt"
          test "$update_status" -eq 1
          grep -Fq 'ERROR no validated game copy is staged in native/game' "$RUNNER_TEMP/builder-update.txt"
          test "$(cat native/.ci-preserve-me)" = "keep-local-native-data"

      - name: Configure the full native game CMake project without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_WORKSPACE="$RUNNER_TEMP/t6-custom-workspace"
          SDK="$CUSTOM_WORKSPACE/third_party/rexglue-sdk"
          CMAKE_BUILD_DIR="$RUNNER_TEMP/t6-native-cmake-build"
          cmake -S "$CUSTOM_WORKSPACE" -B "$CMAKE_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            "-DREXSDK_DIR=$SDK" \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            2>&1 | tee "$RUNNER_TEMP/native-cmake-configure.log"
          if grep -E "Git submodule .* is not initialized|Please run: git submodule update --init --recursive" "$RUNNER_TEMP/native-cmake-configure.log"; then
            echo "CMake still requires Git submodule metadata in the packaged source archive." >&2
            exit 1
          fi

      - name: Build CMake targets that do not require a game image
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_BUILD_DIR="$RUNNER_TEMP/t6-native-cmake-build"
          cmake --build "$CMAKE_BUILD_DIR" --target rexglue xdvdfs_tool ggpo --parallel 2
          REXGLUE_BIN="$(find "$CMAKE_BUILD_DIR" -type f -executable -name rexglue -print -quit)"
          test -n "$REXGLUE_BIN"
          "$REXGLUE_BIN" --help | tee "$RUNNER_TEMP/rexglue-help.txt"
          grep -Fq 'codegen' "$RUNNER_TEMP/rexglue-help.txt"

          # The packaged workspace intentionally omits the retail Default.xex.
          # So CI builds the code generator and host-independent targets, but
          # does not invoke tekken6_codegen or compile the game-specific C++.
  publish-prerelease:
    name: Publish GitHub test prerelease
    needs: [build-appimage, smoke-test-builder-workspace]
    if: ${{ needs.build-appimage.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: Tekken6NativeOnline-linux-${{ needs.build-appimage.outputs.version }}
          path: dist

      - name: Create or update GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-appimage.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          name: "Tekken 6 Native Online Linux ${{ needs.build-appimage.outputs.version }}"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/Tekken6NativeOnline-x86_64.AppImage
            dist/SHA256SUMS
            dist/README-linux-appimage.txt
          body: |
            ## Experimental native Linux test build

            This prerelease contains the native Qt launcher as an AppImage plus the source/SDK workspace needed by its local builder.

            No game executable or copyrighted game data is included. By default the AppImage stages its source workspace into ~/.local/share/tekken6-native-online/workspace; set T6_WORKSPACE_DIR to an absolute workspace path to reuse an existing directory. Mutable native/ game and build state is preserved when source files are refreshed. Choose your own supported Tekken 6 Xbox 360 USA/Europe Rev 1 ISO or extracted disc folder in the launcher; code generation and compilation happen locally.

            The local game build requires Clang 18+, CMake 3.25+, Ninja, Python 3, Git, Vulkan development headers and the Linux audio/window-system development packages listed in README.md.

            This is a prerelease for local testing, not a gameplay-verified release. Please report startup, build, audio, controller and gameplay results before promoting it to a stable release.
